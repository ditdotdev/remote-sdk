#

#
# On creating a new tag, we release our maven artifacts to Maven Central
# (namespace dev.dit). The release is automatic and permanent: once Central
# has validated the upload, the version is published and cannot be changed.
#
name: Release

on: create

permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    name: Test and publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build -Pversion=${GITHUB_REF#refs/tags/}
      - name: Release signed jar to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral -Pversion=${GITHUB_REF#refs/tags/}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
